name: Server CI

# 说明：本项目 ZERO npm 依赖，没有 package-lock.json，也不需要 npm install。
# actions/setup-node 的 npm 缓存需要一个可作为 hash 输入的文件，这里用 package.json。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json

      - name: Run tests
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata (semver + sha + latest)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hxc1818/telegramserver
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || github.ref == 'refs/heads/main' }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and (conditionally) push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # PR 只构建不推送；push 到 main / 打 v* tag 才推送。
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 可选供应链溯源：取消注释并在上方 permissions 增加 attestations: write。
      # - name: Attest image provenance
      #   uses: actions/attest-build-provenance@v2
      #   with:
      #     subject-name: ghcr.io/hxc1818/telegramserver
      #     subject-digest: ${{ steps.build.outputs.digest }}
      #     push-to-registry: true
